name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - name: Verify package
        run: |
          unzip -t bob-openai-compatible-translate.bobplugin
          test "$(unzip -Z1 bob-openai-compatible-translate.bobplugin | sort)" = "$(printf 'LICENSE\ninfo.json\nmain.js')"
